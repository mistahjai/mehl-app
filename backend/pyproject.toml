[project]
name = "mehl-backend"
version = "0.1.0"
description = "Stock and portfolio analytics backend (FastAPI + DuckDB + Polars)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=18.0",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.32",
    "yfinance>=0.2.50",
    "nsepython>=2.97",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
